<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080a0a" />
    <meta name="description" content="My Naai — book trusted salon services without the waiting. Booking alerts with buzzer work even when app is closed." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="My Naai" />
    <meta name="application-name" content="My Naai" />
    <meta name="msapplication-TileColor" content="#080a0a" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.png" />
    <meta name="msapplication-config" content="none" />
    <!-- PWA install prompt - Chrome, Edge, Samsung Internet -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Preload critical assets for faster PWA launch -->
    <link rel="preload" href="/icons/icon-192.png" as="image" />
    <script src="https://checkout.razorpay.com/v1/checkout.js" async></script>
    <script>
      (function () {
        if (window.__mynaaiDevToolsShieldInstalled) return;
        window.__mynaaiDevToolsShieldInstalled = true;
        var known = function (message, stack, filename) {
          if (!/reading 'startTime'/.test(String(message || ''))) return false;
          if (/\breportAllChanges\b/.test(String(stack || ''))) return true;
          return !stack || /^(<anonymous>|devtools:|chrome-extension:)/i.test(String(filename || ''));
        };
        window.addEventListener('error', function (event) {
          if (!event || event.defaultPrevented) return;
          if (!known(event.message, event.error && event.error.stack, event.filename)) return;
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          console.debug('Ignored a known Chrome DevTools Performance-panel error (reportAllChanges/startTime).');
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          if (!reason || !known(reason.message, reason.stack, '')) return;
          event.preventDefault();
        }, true);
      })();
    </script>
    <title>My Naai — your salon, your time</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- PWA install helper - show install prompt when available -->
    <script>
      // Store install prompt for later use
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        console.debug('PWA install prompt available');
        // Dispatch custom event so React can show install button
        window.dispatchEvent(new CustomEvent('pwa-install-available'));
      });
      
      window.addEventListener('appinstalled', () => {
        console.debug('PWA installed successfully');
        window.deferredPWAInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });

      // For iOS PWA - detect standalone mode
      if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
        console.debug('Running as installed PWA');
        document.documentElement.classList.add('pwa-standalone');
      }
    </script>
  </body>
</html>
