    <!-- PWA install prompt - Chrome, Edge, Samsung Internet -->
    <!-- Vector favicon first: the new M/N logo stays crisp in browser tabs at
         any size, with the PNG icons as the fallback for older browsers. -->
    <link rel="icon" type="image/svg+xml" href="/assets/brand/naai-logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Preload critical assets for faster PWA launch -->
    <link rel="preload" href="/icons/icon-192.png" as="image" />
    <script src="https://checkout.razorpay.com/v1/checkout.js" async></script>
    <script>
      (function () {
        if (window.__mynaaiDevToolsShieldInstalled) return;
        window.__mynaaiDevToolsShieldInstalled = true;
        var known = function (message, stack, filename) {
          if (!/reading 'startTime'/.test(String(message || ''))) return false;
          if (/\breportAllChanges\b/.test(String(stack || ''))) return true;
          return !stack || /^(<anonymous>|devtools:|chrome-extension:)/i.test(String(filename || ''));
        };
        window.addEventListener('error', function (event) {
          if (!event || event.defaultPrevented) return;
          if (!known(event.message, event.error && event.error.stack, event.filename)) return;
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          console.debug('Ignored a known Chrome DevTools Performance-panel error (reportAllChanges/startTime).');
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          if (!reason || !known(reason.message, reason.stack, '')) return;
          event.preventDefault();
        }, true);
      })();
    </script>
    <style id="mynaai-dev-error-overlay-style">#mynaai-dev-error-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 99999; padding: 10px 14px; background: #7f1d1d; color: #fff; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; box-shadow: 0 6px 24px rgba(0,0,0,.5); }</style>
  <title>My Naai — your salon, your time</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="mynaai-dev-error-overlay" aria-live="assertive"></div>
    <script type="module">
      // DEV-ONLY diagnostics: if the preview goes blank, show why instead of
      // an empty screen. import.meta.env.DEV is false in production builds,
      // so none of this ships.
      if (import.meta.env.DEV) {
        const problems = [];
        const overlay = document.getElementById('mynaai-dev-error-overlay');
        // A proxy/browser cache may still hold an OLD copy of this page
        // (older than the per-process ?v= module versioning). If that old
        // copy fails to load the app, reload ONCE through a fresh URL —
        // a different URL is a different cache key, so the origin serves
        // the current page. The mynaaiFresh marker prevents loops.
        let selfHealed = false;
        const FRESH_MARK = 'mynaaiFresh=';
        const selfHeal = (context) => {
          if (selfHealed || location.search.indexOf(FRESH_MARK) !== -1) return false;
          selfHealed = true;
          overlay.style.display = 'block';
          overlay.textContent = context + ' — reloading once through a fresh URL to bypass the cached copy…';
          setTimeout(() => {
            location.replace(location.pathname + (location.search ? location.search + '&' : '?') + FRESH_MARK + Date.now());
          }, 900);
          return true;
        };
        const show = (context) => {
          if (!overlay || !problems.length) return;
          overlay.style.display = 'block';
          overlay.textContent = (context || 'DEV ERROR (not shown in production) — ') + problems.slice(0, 3).join(' | ');
        };
        window.addEventListener('error', event => {
          if (event.message) {
            problems.push(event.message + (event.filename ? ' @ ' + event.filename + ':' + event.lineno : ''));
            if (!selfHeal('Load failed')) show('DEV ERROR (not shown in production) — ');
          }
        }, true);
        window.addEventListener('unhandledrejection', event => {
          const reason = event.reason;
          problems.push((reason && (reason.message || String(reason))) || 'unhandled rejection');
          if (!selfHeal('Load failed')) show('DEV ERROR (not shown in production) — ');
        });
        setTimeout(() => {
          const root = document.getElementById('root');
          if (!root || root.childElementCount === 0) {
            if (!problems.length) problems.push('App did not mount and no JS error was captured — check the browser Network tab for a failed module');
            if (!selfHeal('App did not mount')) show('DEV ERROR (not shown in production) — ');
          }
        }, 6000);
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <!-- PWA install helper - show install prompt when available -->
    <script>
      // Store install prompt for later use
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        console.debug('PWA install prompt available');
        // Dispatch custom event so React can show install button
        window.dispatchEvent(new CustomEvent('pwa-install-available'));
      });
      
      window.addEventListener('appinstalled', () => {
        console.debug('PWA installed successfully');
        window.deferredPWAInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });

      // For iOS PWA - detect standalone mode
      if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
        console.debug('Running as installed PWA');
        document.documentElement.classList.add('pwa-standalone');
      }
    </script>
  </body>
</html>
